[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "import-atlas"
version = "0.1.0"
description = "Turn any codebase into an interactive map of how its files connect. One command, one offline HTML file."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["codebase", "visualization", "dependency-graph", "imports", "architecture", "onboarding", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/claudeee617-hue/import-atlas"
Issues = "https://github.com/claudeee617-hue/import-atlas/issues"

[project.scripts]
import-atlas = "import_atlas.cli:main"

[tool.setuptools]
packages = ["import_atlas"]

[tool.setuptools.package-data]
import_atlas = ["template.html"]
