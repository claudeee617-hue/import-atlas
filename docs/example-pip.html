*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:grid;grid-template-columns:350px 1fr;overflow:hidden}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.pad{padding:16px 18px}
.brand{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
h1{font-size:20px;line-height:1.2;margin:6px 0 4px;word-break:break-word}
.stats{color:var(--mute);font-size:13px}
.note{margin-top:8px;padding:8px 10px;background:var(--chip);border-radius:8px;font-size:12px;color:var(--mute)}
input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;outline:none}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;padding:5px 8px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.row label{display:flex;gap:6px;align-items:center;cursor:pointer}
section{border-top:1px solid var(--line)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 8px;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li button.item{display:flex;width:100%;text-align:left;gap:8px;align-items:baseline;border:0;background:transparent;color:var(--ink);padding:5px 8px;margin:0 -8px;border-radius:7px;cursor:pointer;font:inherit;width:calc(100% + 16px)}
li button.item:hover{background:var(--hover)}
.mono{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.sub{color:var(--mute);font-size:12px;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;transform:translateY(1px)}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--mute);margin:0 4px 4px 0}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.legend li button.item[aria-pressed=false]{opacity:.4}
.legend .count{margin-left:auto;color:var(--mute);font-size:12px}
.more{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:12px;padding:4px 0}
#detail .path{font-family:var(--mono);font-size:12px;color:var(--mute);word-break:break-all;margin:2px 0 10px}
#detail h3{margin:0;font-size:17px;word-break:break-all}
.close{float:right;background:var(--chip);border:0;color:var(--mute);border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:16px;line-height:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:var(--hover)}
.spacer{flex:1}
footer{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}
footer a{color:var(--accent);text-decoration:none}
main{position:relative;min-width:0;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
canvas.pt{cursor:pointer}
#tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:9px;padding:7px 10px;font-size:12px;max-width:340px;display:none;z-index:3}
#tip b{font-family:var(--mono);font-weight:600;word-break:break-all;display:block;margin-bottom:2px}
#tip span{color:var(--mute)}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--mute);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:5px 10px;border-radius:8px;border:1px solid var(--line)}
.keys{position:absolute;right:14px;top:12px;display:flex;gap:8px}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:30px}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 46vh}
  main{order:-1}
  aside{border-right:0;border-top:1px solid var(--line)}
  .hint{display:none}
}

let anim = null;

// ---------- layout (force simulation, vanilla)
const G = D.groups.length;
const CELL = 70;
let alpha = 1;
function initLayout() {
  const R0 = 38 * Math.sqrt(G) + 11 * Math.sqrt(N);

    const a = g * 2.399963, r = R0 * Math.sqrt((g + 0.5) / G);

  });
  const seen = new Array(G).fill(0);
  nodes.forEach((n, i) => {
    const [ax, ay] = anchors[n.g];
    const j = seen[n.g]++, spread = 9 * Math.sqrt(D.groups[n.g].count) + 14;
    const a = j * 2.399963, r = spread * Math.sqrt((j + 0.5) / D.groups[n.g].count);
    P[i].x = ax + Math.cos(a) * r; P[i].y = ay + Math.sin(a) * r;

}
const deg = nodes.map((n) => Math.max(1, n.i + n.o));
function tick() {
  const grid = new Map();
  for (let i = 0; i < N; i++) {
    const p = P[i], key = Math.floor(p.x / CELL) * 100003 + Math.floor(p.y / CELL);
    const cell = grid.get(key);
    if (cell) cell.push(i); else grid.set(key, [i]);
  }
  for (let i = 0; i < N; i++) {
    const p = P[i], cx = Math.floor(p.x / CELL), cy = Math.floor(p.y / CELL);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const arr = grid.get((cx + dx) * 100003 + (cy + dy));
      if (!arr) continue;
      for (const j of arr) {
        if (j <= i) continue;
        const q = P[j];
        let ddx = p.x - q.x, ddy = p.y - q.y, d2 = ddx * ddx + ddy * ddy;
        if (d2 > CELL * CELL) continue;
        if (d2 < 0.01) { ddx = Math.random() - 0.5; ddy = Math.random() - 0.5; d2 = ddx * ddx + ddy * ddy + 0.01; }
        const d = Math.sqrt(d2), minD = p.r + q.r + 5;
        let f = 380 / d2; if (d < minD) f += (minD - d) * 0.5;
        f *= alpha;

  }
  for (const [s, t] of edges) {
    const a = P[s], b = P[t];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const L = 26 + a.r + b.r, k = (0.07 / Math.sqrt(Math.min(deg[s], deg[t]))) * alpha;
    const f = (d - L) * k, fx = (dx / d) * f, fy = (dy / d) * f;

  for (let i = 0; i < N; i++) {
    const p = P[i], g = nodes[i].g;
    p.vx += (gx[g] / gc[g] - p.x) * 0.02 * alpha - p.x * 0.0035 * alpha;
    p.vy += (gy[g] / gc[g] - p.y) * 0.02 * alpha - p.y * 0.0035 * alpha;

// ---------- drawing
function arrow(x0, y0, x1, y1, r1, size) {
  const a = Math.atan2(y1 - y0, x1 - x0), tx = x1 - Math.cos(a) * (r1 + 1), ty = y1 - Math.sin(a) * (r1 + 1);
  ctx.beginPath(); ctx.moveTo(tx, ty);
  ctx.lineTo(tx - Math.cos(a - 0.45) * size, ty - Math.sin(a - 0.45) * size);
  ctx.lineTo(tx - Math.cos(a + 0.45) * size, ty - Math.sin(a + 0.45) * size);

}
function draw() {

  }
  ctx.stroke(); ctx.globalAlpha = 1;

  // highlighted edges for the selected / hovered node
  const hl = sel >= 0 ? sel : hover;
  if (hl >= 0 && vis[hl]) {
    ctx.lineWidth = 1.7 / k;
    for (const [list, color, incoming] of [[outs[hl], C.out, false], [ins[hl], C.inn, true]]) {
      ctx.strokeStyle = color; ctx.fillStyle = color;
      for (const j of list) {
        if (!vis[j]) continue;
        const a = incoming ? P[j] : P[hl], b = incoming ? P[hl] : P[j];
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        arrow(a.x, a.y, b.x, b.y, b.r, 7 / k);

  }

  // nodes
  for (let i = 0; i < N; i++) {
    if (!vis[i]) continue;
    const p = P[i], n = nodes[i], on = lit(i);
    ctx.globalAlpha = on ? 1 : 0.13;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
    ctx.fillStyle = colorOf(i); ctx.fill();
    if (n.t) { ctx.lineWidth = 1.2 / k; ctx.strokeStyle = C.bg; ctx.stroke(); }
    if (n.c >= 0 && on) { ctx.lineWidth = 1.3 / k; ctx.strokeStyle = C.bad; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 1.6 / k, 0, 6.2832); ctx.stroke(); }
    if (i === sel || i === hover) { ctx.lineWidth = 2.4 / k; ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 3 / k, 0, 6.2832); ctx.stroke(); }
  }

}
function drawLabels(vis, lit) {
  ctx.font = "600 11.5px " + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const cand = [];
  for (let i = 0; i < N; i++) {
    if (!vis[i]) continue;
    const p = P[i], sx = p.x * view.k + view.x, sy = p.y * view.k + view.y;
    if (sx < -40 || sy < -20 || sx > W + 40 || sy > H + 20) continue;
    const forced = i === sel || i === hover || (sel >= 0 && focus && focus.has(i) && !query) || (query && focus && focus.has(i)) || (cyc >= 0 && focus && focus.has(i));
    const rr = p.r * view.k;
    const show = forced || (lit(i) && ((rr >= 11 && view.k > 0.3) || (view.k > 1.5 && rr >= 6.5) || (view.k > 2.6 && rr >= 4.2) || view.k > 4.2));
    if (show) cand.push({ i, sx, sy, rr, w: i === sel || i === hover ? 3 : forced ? 2 : 1, score: p.r + (forced ? 100 : 0) });
  }
  cand.sort((a, b) => b.score - a.score);

  let count = 0;
  for (const c of cand) {
    if (count > 90) break;
    const text = base(nodes[c.i].p), tw = ctx.measureText(text).width;
    const box = [c.sx - tw / 2 - 3, c.sy + c.rr + 3, c.sx + tw / 2 + 3, c.sy + c.rr + 17];
    if (c.w < 3 && placed.some((b) => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;

}

// ---------- interaction
function hit(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  let best = -1, bd = Infinity;
  for (let i = 0; i < N; i++) {
    if (!isVisible(i)) continue;
    const p = P[i], d = Math.hypot(p.x - wx, p.y - wy), lim = p.r + 4 / view.k;
    if (d <= lim && d < bd) { bd = d; best = i; }
  }

}
const tip = $("#tip");
function showTip(i, sx, sy) {
  const n = nodes[i];
  tip.innerHTML = `<b>${esc(n.p)}</b><span>${n.n} lines · ${esc(D.langs[n.l].name)} · imported by ${n.i} · imports ${n.o}${n.c >= 0 ? " · in a cycle" : ""}</span>`;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, sx + 14), W - w - 8) + "px";
  tip.style.top = Math.min(Math.max(8, sy + 14), H - h - 8) + "px";
}
let drag = null;
cv.addEventListener("pointerdown", (e) => {
  cv.setPointerCapture(e.pointerId);

  const i = hit(sx, sy);
  drag = { sx, sy, x0: view.x, y0: view.y, node: i, moved: false };
  if (i >= 0) { P[i].fixed = true; }
  cv.classList.add("drag"); anim = null;
});
cv.addEventListener("pointermove", (e) => {
  const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
  if (drag) {
    const dx = sx - drag.sx, dy = sy - drag.sy;
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    if (drag.node >= 0 && drag.moved) {
      const [wx, wy] = toWorld(sx, sy); P[drag.node].x = wx; P[drag.node].y = wy; alpha = Math.max(alpha, 0.25);
    } else if (drag.node < 0) { view.x = drag.x0 + dx; view.y = drag.y0 + dy; }

  }
  const i = hit(sx, sy);

  if (i >= 0) showTip(i, sx, sy); else tip.style.display = "none";
});
function endDrag() {
  if (!drag) return;
  if (drag.node >= 0) P[drag.node].fixed = false;

  drag = null; cv.classList.remove("drag");

cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

cv.addEventListener("wheel", (e) => {
  e.preventDefault(); anim = null;
  const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), k = Math.min(14, Math.max(0.04, view.k * f));
  const [wx, wy] = toWorld(sx, sy);
  view = { k, x: sx - wx * k, y: sy - wy * k }; dirty = true;
}, { passive: false });

// ---------- sidebar
const listItem = (i, extra) => `<li><button class="item" data-i="${i}"><span class="sw" style="background:${colorOf(i)}"></span><span class="mono">${esc(nodes[i].p)}</span>${extra ? `<span class="sub">${esc(extra)}</span>` : ""}</button></li>`;
function bindItems(root) {
  root.querySelectorAll("button.item[data-i]").forEach((b) => b.addEventListener("click", () => select(+b.dataset.i, true)));
}
function renderStatic() {
  $("#name").textContent = D.name;
  const s = D.summary;
  $("#stats").textContent = `${s.files.toLocaleString()} files · ${s.loc.toLocaleString()} lines · ${s.links.toLocaleString()} links`;
  if (s.truncated) {
    const note = $("#note"); note.hidden = false;
    note.textContent = s.shown < s.files ? `Showing the ${s.shown.toLocaleString()} most connected of ${s.files.toLocaleString()} files.` : "Some files were skipped because the repo is very large.";
  }
  if (D.startHere.length) {
    $("#startSec").hidden = false;
    $("#start").innerHTML = D.startHere.map((x) => listItem(x.i, x.why)).join("");
    bindItems($("#start"));
  }
  if (D.cycles.length) {
    $("#cycSec").hidden = false;
    $("#cyc").innerHTML = D.cycles.map((c, ci) => `<li><button class="item" data-c="${ci}"><span class="sw" style="background:var(--bad)"></span><span class="mono">${esc(c.slice(0, 3).map((i) => base(nodes[i].p)).join(" ↔ "))}${c.length > 3 ? ` +${c.length - 3}` : ""}</span><span class="sub">${c.length} files</span></button></li>`).join("");
    $("#cyc").querySelectorAll("button.item").forEach((b) => b.addEventListener("click", () => toggleCycle(+b.dataset.c)));
  }
  if (D.externals.length) {
    $("#extSec").hidden = false;
    $("#ext").innerHTML = D.externals.map(([n, c]) => `<span class="chip">${esc(n)} · ${c}</span>`).join("");
  }
}
function renderLegend() {
  const ul = $("#legend");
  let items = [];
  if (mode === "group") {
    $("#legendTitle").textContent = "Folders";
    items = D.groups.slice(0, 40).map((g, gi) => ({ key: gi, color: groupColor(gi), label: g.name, count: g.count, hidable: true }));
  } else if (mode === "lang") {
    $("#legendTitle").textContent = "Languages";
    items = D.langs.map((l, li) => ({ key: li, color: langColor(li), label: l.name, count: l.files }));
  } else {
    $("#legendTitle").textContent = "Roles";
    const cnt = {}; nodes.forEach((n) => { cnt[n.r] = (cnt[n.r] || 0) + 1; });
    items = ROLE_ORDER.filter((r) => cnt[r]).map((r) => ({ key: r, color: roleColor(r), label: ROLES[r].label, count: cnt[r], desc: ROLES[r].desc }));
  }
  ul.innerHTML = items.map((it) => `<li><button class="item" ${it.hidable ? `data-g="${it.key}" aria-pressed="${!hiddenGroups.has(it.key)}"` : ""} ${it.desc ? `title="${esc(it.desc)}"` : ""}><span class="sw" style="background:${it.color}"></span><span class="mono">${esc(it.label)}</span>${it.desc ? `<span class="sub">${esc(it.desc)}</span>` : ""}<span class="count">${it.count}</span></button></li>`).join("");
  ul.querySelectorAll("button[data-g]").forEach((b) => b.addEventListener("click", () => {
    const g = +b.dataset.g; if (hiddenGroups.has(g)) hiddenGroups.delete(g); else hiddenGroups.add(g);
    b.setAttribute("aria-pressed", String(!hiddenGroups.has(g))); dirty = true;
  }));
}
function renderDetail() {
  const box = $("#detail");
  if (sel < 0) { box.hidden = true; return; }
  const n = nodes[sel];
  const cap = (list, id) => {
    const shown = list.slice(0, 40);
    return shown.map((i) => listItem(i)).join("") + (list.length > 40 ? `<li><span class="sub">+${list.length - 40} more</span></li>` : "");
  };
  const sortByName = (a) => a.slice().sort((x, y) => nodes[x].p.localeCompare(nodes[y].p));
  box.hidden = false;
  box.innerHTML = `<button class="close" aria-label="Close details" id="closeDetail">×</button><h3>${esc(base(n.p))}</h3><div class="path">${esc(n.p)}</div>
    <div><span class="chip">${esc(D.langs[n.l].name)}</span><span class="chip">${n.n.toLocaleString()} lines</span><span class="chip" title="${esc(ROLES[n.r].desc)}">${ROLES[n.r].label}</span>${n.t ? '<span class="chip">test</span>' : ""}${n.c >= 0 ? '<span class="chip bad">in a circular import</span>' : ""}</div>
    ${outs[sel].length ? `<h2 style="margin-top:14px"><span style="color:var(--out)">→</span> Imports (${outs[sel].length})</h2><ul>${cap(sortByName(outs[sel]))}</ul>` : ""}
    ${ins[sel].length ? `<h2 style="margin-top:14px"><span style="color:var(--in)">←</span> Imported by (${ins[sel].length})</h2><ul>${cap(sortByName(ins[sel]))}</ul>` : ""}
    ${n.x.length ? `<h2 style="margin-top:14px">Uses packages</h2><div>${n.x.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>` : ""}`;
  bindItems(box);
  $("#closeDetail").addEventListener("click", () => select(-1));
}

// ---------- actions
function select(i, center) {
  sel = i; cyc = -1;
  if (i >= 0 && !isVisible(i)) { hiddenGroups.delete(nodes[i].g); showTests = true; $("#tests").checked = true; renderLegend(); }
  computeFocus(); renderDetail();
  if (i >= 0 && center) {
    const k = Math.max(view.k, 1.1), p = P[i];
    goTo({ k, x: W / 2 - p.x * k, y: H / 2 - p.y * k }, true);
  }
  if (i >= 0) $("#detail").scrollIntoView({ block: "nearest" });
}
function toggleCycle(ci) {

  computeFocus(); renderDetail();
  if (cyc >= 0) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const i of D.cycles[cyc]) { const p = P[i]; x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }

$("#modes").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-m]"); if (!b) return;

  renderLegend(); renderStatic.lists(); dirty = true;
});
renderStatic.lists = function () { // colour dots in lists depend on the mode

  renderDetail();
};
$("#tests").addEventListener("change", (e) => { showTests = e.target.checked; dirty = true; });
$("#labels").addEventListener("change", (e) => { showLabels = e.target.checked; dirty = true; });

$("#q").addEventListener("keydown", (e) => {

    query = ""; select(first, true); e.target.value = ""; e.target.blur();
  }
});
$("#save").addEventListener("click", () => {
  draw();
  cv.toBlob((b) => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = (D.name || "repo") + "-atlas.png"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
});
addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "Escape") { query = ""; $("#q").value = ""; cyc = -1; select(-1); $("#q").blur(); }
  else if (e.key === "0" && document.activeElement.tagName !== "INPUT") fitView(true);

addEventListener("resize", () => { resize(); });
darkMQ.addEventListener && darkMQ.addEventListener("change", () => { readColors(); renderLegend(); renderStatic.lists(); dirty = true; });

// ---------- boot
readColors(); resize(); renderStatic(); renderLegend();
if (!N) { $("#empty").style.display = "flex"; }

}
function frame(now) {
